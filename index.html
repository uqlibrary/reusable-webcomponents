<!DOCTYPE html>
<html style="padding: 0; margin: 0" lang="en">
    <head>
        <title>UQ Library - Reusable Web Components</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <link rel="stylesheet" type="text/css" href="https://static.uq.net.au/v15/fonts/Roboto/roboto.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://static.uq.net.au/v15/fonts/Merriweather/merriweather.css"
        />
        <link rel="stylesheet" type="text/css" href="https://static.uq.net.au/v15/fonts/Montserrat/montserrat.css" />
        <style>
            .layout-card {
                margin-left: 1rem;
                margin-right: 1rem;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }

            @media (min-width: 37.5rem) {
                .layout-card {
                    padding-left: 0.75rem;
                    padding-right: 0.75rem;
                    margin-left: 3.25rem;
                    margin-right: 3.25rem;
                    max-width: none;
                }
            }

            @media (min-width: 69.25rem) {
                .layout-card {
                    margin-left: auto;
                    margin-right: auto;
                    max-width: 61.5rem;
                }
            }

            @media (min-width: 80rem) {
                .layout-card {
                    margin-left: 8.375rem;
                    margin-right: 8.375rem;
                    max-width: none;
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
            }

            @media (min-width: 90rem) {
                .layout-card {
                    margin-left: auto;
                    margin-right: auto;
                    max-width: 71rem;
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
            }
            .drupalWrapper {
                display: flex;
                padding-right: 30px;
                padding-left: 30px;
            }
            .drupalBody {
                flex-grow: 1;
            }
            .drupalLeft {
                width: 261px;
                margin-left: 5%;
            }
            @media only screen and (max-width: 1096px) {
                .drupalWrapper {
                    display: block;
                }
                .drupalLeft,
                .drupalBody {
                    width: 100%;
                }
            }
            .full-width-purple {
                background-color: #51247a;
            }
            .search-spacing {
                padding-top: 40px;
                padding-bottom: 40px;
            }
        </style>
    </head>
    <body style="padding: 0; margin: 0; font-family: 'Roboto', sans-serif; background-color: #f7f7f7">
        <!-- This is a test GTM code - insert your site's GTM with attribute name `gtm` -->
        <uq-gtm></uq-gtm>

        <uq-header hidelibrarymenuitem skipnavid="skiptohere"></uq-header>
        <uq-site-header sitetitle="Library Test" showmenu>
            <span slot="site-utilities">
                <auth-button />
            </span>
        </uq-site-header>
        <cultural-advice secondsTilCulturalAdviceAppears="2"></cultural-advice>

        <alert-list system="homepage"></alert-list>
        <div class="layout-card">
            <h1 id="skiptohere" tabindex="-1">UQ Library - Reusable Web Components sampler</h1>
            <p data-testid="random-page-element">Lorem ipsum</p>
        </div>
        <div class="layout-card">
            <h2>Search portal, Dark theme (homepage)</h2>
        </div>
        <div class="full-width-purple">
            <div class="layout-card">
                <search-portal theme="dark"></search-portal>
            </div>
        </div>
        <div class="layout-card" style="min-height: 200px">
            <h2>OpenAthens - Copy a link</h2>
            <open-athens create-link="true"></open-athens>
        </div>
        <div class="layout-card" style="min-height: 300px">
            <div class="drupalWrapper">
                <div class="drupalBody">
                    <div class="uq-section__header">
                        <h2 class="uq-section__title">Busy level for library spaces</h2>
                    </div>
                    <p>Updates every 2 minutes.</p>
                    <div
                        class="uq-card-grid uq-card-grid--target-2x space-availability-wrapper"
                        style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px"
                    >
                        <div class="block block-uq-landing-page block-uq-landing-page-embedded-widget">
                            <space-availability id="7877"></space-availability>
                        </div>
                        <div class="block block-uq-landing-page block-uq-landing-page-embedded-widget">
                            <space-availability id="7879"></space-availability>
                        </div>
                        <div class="block block-uq-landing-page block-uq-landing-page-embedded-widget">
                            <space-availability id="7665"></space-availability>
                        </div>
                    </div>
                    <h2>Demo Training</h2>
                    <library-training></library-training>
                </div>
            </div>
        </div>

        <connect-footer></connect-footer>
        <uq-footer loginurl="http://library.uq.edu.au"></uq-footer>
        <proactive-chat secondsTilProactiveChatAppears="3"></proactive-chat>
    </body>
</html>
